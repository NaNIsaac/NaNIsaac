name: Profile refresh

on:
  schedule:
    # Every day at 09:00 KST (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/pepper_harvest.py"
      - "assets/pepper/frames/*.png"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update upstream PR list
        run: python3 scripts/update_contrib.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Pepper's contribution garden
        run: python3 scripts/pepper_harvest.py --username "$GITHUB_REPOSITORY_OWNER" --output-dir assets/pepper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit & Push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md assets/pepper/pepper-harvest-light.svg assets/pepper/pepper-harvest-dark.svg
          git commit -m "chore: refresh Pepper and PR list" || exit 0
          git push
