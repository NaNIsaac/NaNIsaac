name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # 매일 한국 시간 기준 오전 9시(UTC 00:00)에 자동 실행
    - cron: "0 0 * * *"
  workflow_dispatch:

# 리포지토리에 푸시할 수 있도록 권한을 직접 부여합니다.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v7
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Update upstream PR list
        run: python3 scripts/update_contrib.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit & Push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib/ README.md
          git commit -m "chore: refresh contrib graph and PR list" || exit 0
          git push
