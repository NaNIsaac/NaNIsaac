name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # Every day at 09:00 KST (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/pepper_harvest.py"
      - "assets/pepper/*.png"
      - ".github/workflows/profile-3d.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v7
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Update upstream PR list
        run: python3 scripts/update_contrib.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Pepper's contribution garden
        run: python3 scripts/pepper_harvest.py --username "$GITHUB_REPOSITORY_OWNER" --output-dir assets/pepper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit & Push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib/ README.md assets/pepper/pepper-harvest-light.svg assets/pepper/pepper-harvest-dark.svg
          git commit -m "chore: refresh contribution graphs, Pepper and PR list" || exit 0
          git push
